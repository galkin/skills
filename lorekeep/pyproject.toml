[project]
name = "lorekeep"
version = "0.2.4"
description = "Collects the Sources an LLM task reads, keeps them as Markdown with their Provenance, and makes them searchable."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cssselect",
    "httpx",
    "markitdown[pdf]",
    "pyyaml",
    "trafilatura",
]

[project.optional-dependencies]
browser = ["crawl4ai"]

[project.scripts]
lorekeep = "lorekeep.cli:main"

[dependency-groups]
dev = [
    "frictionless",
    "packaging",
    "pyright",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
# Recorded responses are bytes as a publisher served them; a Twin's Python fences are not ours.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
